# Postgres para desarrollo local: npm run db:up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pagodirecto
      POSTGRES_USER: pagodirecto
      POSTGRES_PASSWORD: pagodirecto
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
